name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" == *-pdf ]]; then
            VERSION="${TAG#v}"
            VERSION="${VERSION%-pdf}"
            INCLUDE_PDF=true
          else
            VERSION="${TAG#v}"
            INCLUDE_PDF=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "include_pdf=$INCLUDE_PDF" >> "$GITHUB_OUTPUT"

      - name: Download font
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.FONT_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/sstrahl/constantia-assets/contents/constantia_fonts.zip \
            | jq -r .content | base64 -d > fonts.zip

          unzip fonts.zip
          mkdir -p ~/.local/share/fonts/constantia
          cp constantia_ci/*.ttf ~/.local/share/fonts/constantia/
          fc-cache -fv
          fc-list | grep -i constantia

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" 

      - name: Install Python dependencies
        run: |
          pip install jupyter nbconvert[webpdf]
          playwright install chromium

      - name: Build HTML and PDF notebooks
        run: python tools/run_and_export_notebooks.py --no-clean --no-run   

      - name: Create merged PDF (XeLaTeX)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: PCP_all.tex
          working_directory: tools/pdf_booklet
          latexmk_use_xelatex: true
          pre_compile: texlua extract_annotations.lua

      - name: Create zip file          
        run: |
          ZIP_NAME="PCP_${{ steps.get_version.outputs.version }}.zip"

          if [[ "${{ steps.get_version.outputs.include_pdf }}" == "true" ]]; then
            cp tools/pdf_booklet/PCP_all.pdf ./PCP_all.pdf
            zip "$ZIP_NAME" -@ < <(git ls-files; ls *.html; echo PCP_all.pdf)
          else
            zip "$ZIP_NAME" -@ < <(git ls-files; ls *.html)
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: PCP_${{ steps.get_version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
